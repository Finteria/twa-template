<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171118">
<title>Red Flags – 2 Players</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;background:linear-gradient(160deg,#171118,#2a1321);color:#fff;min-height:100vh}.wrap{max-width:760px;margin:auto;padding:18px 18px 44px}h1{text-align:center;margin:8px 0 4px;font-size:40px}.sub{text-align:center;color:#cdbfcf;margin-bottom:18px}.tabs,.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tabs button,.actions button,.wide{border:0;border-radius:14px;padding:15px;font-weight:800;font-size:17px;cursor:pointer}.tabs button{background:#2a222c;color:#fff}.tabs button.active{background:#e9365d}.card{margin:16px 0;background:#261c27;border:1px solid #3d3040;border-radius:20px;padding:24px;min-height:190px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:29px;font-weight:800;box-shadow:0 18px 45px rgba(0,0,0,.25)}.info{display:flex;justify-content:space-between;color:#cfbecf;font-size:14px}.draw{background:#e9365d;color:white}.stay{background:#49d39c;color:#0d251c}.breakup{background:#f4e9ee;color:#2a1720}.actions button:nth-child(4){background:#332735;color:#fff}.wide{width:100%;margin-top:10px;background:#312633;color:white}.history{margin-top:20px}.histbox{background:#211922;border:1px solid #342735;border-radius:16px;padding:14px;margin-top:10px}.item{padding:10px 0;border-bottom:1px solid #3a303c;font-size:14px}.item:last-child{border-bottom:0}.small{font-size:12px;color:#b9a9bb;margin-top:4px}.hint{text-align:center;font-size:13px;color:#aa98ad;margin-top:10px}@media(max-width:520px){h1{font-size:34px}.card{font-size:25px;min-height:170px}.actions{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
<h1>RED FLAGS 🚩</h1>
<div class="sub">2-player dating disaster edition</div>
<div class="tabs"><button id="p1" class="active">Player 1</button><button id="p2">Player 2</button></div>
<div class="info"><span id="turn">Player 1</span><span id="count">100 left</span></div>
<div class="card" id="card">Tap “Draw Red Flag”</div>
<div class="actions"><button id="draw" class="draw">🚩 Draw</button><button id="stay" class="stay">❤️ Stay</button><button id="breakup" class="breakup">💔 Break Up</button><button id="switch">↔ Switch</button></div>
<button class="wide" id="reset">↻ New Game</button>
<div class="hint">Stay = same imaginary partner gets worse. Break Up = start with a new partner.</div>
<div class="history"><h2>Previous red flags</h2><div class="histbox"><b>Player 1</b><div id="h1"></div></div><div class="histbox"><b>Player 2</b><div id="h2"></div></div></div>
</div>
<script>
(function(){
var FLAGS=["Calls their mother during every date.","Still shares a Netflix account with their ex — and watches together.","Claps when the plane lands.","Has a framed photo of themselves in every room.","Says “I hate drama” at least twice a day.","Has a spreadsheet ranking all their exes.","Corrects your grammar during arguments.","Brings a protein shaker to weddings.","Has a tattoo of their own name.","Rates every date out of 10 before going home.","Only listens to one song. Ever.","Posts motivational quotes after every minor inconvenience.","Orders for you without asking what you want.","Still goes on family holidays with an ex.","Believes birthdays are a capitalist conspiracy.","Has a pet snake called ‘Baby’.","Calls every waiter ‘boss’.","Has no chairs at home — only beanbags.","Says “I’m brutally honest” before insulting people.","Their phone wallpaper is a selfie of themselves.","Wears sunglasses indoors after sunset.","Still uses their ex’s Spotify playlist every day.","Takes 35 selfies before ordering breakfast.","Has a favorite traffic light in the city.","Asks your star sign before asking your name.","Has been banned from three different karaoke bars.","Brings Monopoly to every romantic weekend.","Says they ‘don’t believe in labels’ after six months of dating.","Owns a life-size cardboard cutout of a celebrity.","Talks to their plants but ignores your messages.","Keeps ketchup in the bathroom fridge.","Introduces you as ‘my current partner’.","Uses LinkedIn like a dating app.","Has named every appliance in their kitchen.","Claims they can ‘read people instantly’.","Never closes kitchen cupboards.","Keeps a bag of emergency glitter in the car.","Sends “k” when angry and nothing else for 48 hours.","Insists pineapple belongs on every pizza.","Has a podcast nobody has ever heard of.","Brings their laptop on romantic dinners ‘just in case’.","Says “I don’t do jealousy” while checking who liked your photos.","Owns six different air fryers.","Cries every time their football team loses.","Has matching outfits with their dog.","Calls their car ‘she’ and buys it birthday gifts.","Believes all problems can be solved with cold showers.","Has chosen your future children’s names after the second date.","Still sends Facebook pokes.","Has three phones and won’t explain why.","Has a tattoo in a language they do not speak.","Says “trust me” before every terrible idea.","Keeps a folder called ‘Evidence’ on their desktop.","Has written a breakup speech ‘just in case’.","Flirts with customer-service chatbots.","Brings their own hot sauce everywhere.","Has a five-year plan for your relationship after one week.","Owns more candles than plates.","Has a lucky spoon and refuses to use another one.","Thinks every waiter is secretly flirting with them.","Has fake arguments in the shower and usually wins.","Insists on being DJ at every party.","Has a favorite ex and tells you which one.","Uses a baby voice when asking for favors.","Celebrates monthly anniversaries with PowerPoint presentations.","Keeps screenshots of compliments people gave them.","Says “we need to talk” and then asks what you want for dinner.","Checks your Instagram followers after every date.","Brings their parent on the third date.","Refuses to delete dating apps because they are ‘just for networking’.","Still has a toothbrush at their ex’s place.","Has a wedding Pinterest board before meeting you.","Names every future pet before the first kiss.","Has blocked and unblocked the same ex 27 times.","Never says sorry, only ‘sorry you feel that way’.","Calls themselves an empath after starting every argument.","Needs 14 alarms to wake up.","Sends good-morning texts at 4:55 a.m.","Has a secret TikTok dance account.","Has a drawer full of hotel shampoos from 2009.","Refuses to share dessert but always eats yours.","Has a ‘special chair’ nobody else may sit on.","Carries a tiny spoon everywhere.","Changes personality depending on who enters the room.","Always says ‘I know the owner’ at restaurants.","Has an inspirational quote tattoo with a spelling mistake.","Uses your birthday as their phone PIN after one date.","Has 18 houseplants, all named after exes.","Refuses to watch anything with subtitles.","Has a backup date planned in case yours ends early.","Brings their own candles to restaurants.","Keeps score during arguments.","Has a group chat dedicated to discussing your relationship.","Has never cooked a meal but owns 27 cookbooks.","Thinks ghosting is ‘energy management’.","Has a dating résumé.","Uses a ring light for normal video calls.","Refuses to sit facing away from the restaurant entrance.","Has already introduced you as ‘the one’ after 48 hours.","Owns a karaoke microphone and carries it everywhere."];
var deck=[],currentPlayer=0,currentFlag=null,players=[];
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function save(){try{localStorage.setItem("redflags-v1",JSON.stringify({deck:deck,currentPlayer:currentPlayer,currentFlag:currentFlag,players:players}))}catch(e){}}
function load(){try{var x=JSON.parse(localStorage.getItem("redflags-v1"));if(x&&x.deck&&x.players){deck=x.deck;currentPlayer=x.currentPlayer||0;currentFlag=x.currentFlag||null;players=x.players;return true}}catch(e){}return false}
function newGame(){deck=shuffle(FLAGS.slice());currentPlayer=0;currentFlag=null;players=[{partner:1,history:[]},{partner:1,history:[]}];save();render()}
function setPlayer(i){currentPlayer=i;save();render()}
function draw(){if(currentFlag!==null){alert("Choose Stay or Break Up first.");return}if(deck.length===0){alert("All 100 red flags are finished!");return}currentFlag=deck.pop();players[currentPlayer].history.push({flag:currentFlag,partner:players[currentPlayer].partner,decision:""});save();render()}
function decide(decision){if(currentFlag===null){alert("Draw a red flag first.");return}var h=players[currentPlayer].history;h[h.length-1].decision=decision;if(decision==="breakup")players[currentPlayer].partner++;currentFlag=null;currentPlayer=currentPlayer===0?1:0;save();render()}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function hist(i){var arr=players[i].history.slice().reverse();if(!arr.length)return '<div class="item">No red flags yet.</div>';var s="";for(var k=0;k<arr.length;k++){var d=arr[k].decision==="stay"?"❤️ Stayed":arr[k].decision==="breakup"?"💔 Broke up":"⏳ Deciding";s+='<div class="item">🚩 '+esc(arr[k].flag)+'<div class="small">Partner #'+arr[k].partner+' · '+d+'</div></div>'}return s}
function render(){document.getElementById("p1").className=currentPlayer===0?"active":"";document.getElementById("p2").className=currentPlayer===1?"active":"";document.getElementById("turn").textContent="Player "+(currentPlayer+1)+" · Partner #"+players[currentPlayer].partner;document.getElementById("count").textContent=deck.length+" left";document.getElementById("card").textContent=currentFlag||"Tap “Draw Red Flag”";document.getElementById("h1").innerHTML=hist(0);document.getElementById("h2").innerHTML=hist(1)}
document.getElementById("p1").onclick=function(){setPlayer(0)};document.getElementById("p2").onclick=function(){setPlayer(1)};document.getElementById("draw").onclick=draw;document.getElementById("stay").onclick=function(){decide("stay")};document.getElementById("breakup").onclick=function(){decide("breakup")};document.getElementById("switch").onclick=function(){setPlayer(currentPlayer===0?1:0)};document.getElementById("reset").onclick=function(){if(confirm("Start a completely new game?"))newGame()};
if(!load())newGame();else render();
})();
</script>
</body>
</html>
